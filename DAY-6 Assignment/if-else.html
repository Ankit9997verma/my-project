<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let marks = prompt("Enter your marks.");
        if(marks<0 || marks>100){
            alert("Enter valid marks");
            
        }
        if(marks>89){
            console.log("A");
            alert("Excellent!")
        }else if(marks>74 && marks<90){
            console.log("B");
            alert("Great job!")
        
        }else if(marks>59 && marks<75){
            console.log("C");
            alert("Good!")
        }
        else if(marks>39 && marks<60){
            console.log("D");
            alert("You Passed")
        }
        else{
            console.log("F");
            alert("Better Luck Next Time.")
        }
    </script>
</body>
</html>
